# Environnement de développement : API Symfony + MariaDB avec une copie de la base du site.
# Démarrage : docker compose up -d   (voir README, section « Installation en développement »)
services:
  db:
    # Même version que le serveur de la cliente (export phpMyAdmin : MariaDB 10.4)
    image: mariadb:10.4
    environment:
      MARIADB_ROOT_PASSWORD: root_dev_password   # développement uniquement
      MARIADB_DATABASE: agence_voyage
    ports:
      - "127.0.0.1:3307:3306"   # 3307 pour ne pas gêner un MySQL/XAMPP local
    volumes:
      - db_data:/var/lib/mysql
      # Exécutés une seule fois, au premier démarrage (volume vide) :
      # 00 comptes MySQL, 01 schéma d'origine du site, 02 données de test
      - ./docker/db/init:/docker-entrypoint-initdb.d:ro
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot_dev_password"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build: ./docker/php
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
    ports:
      - "127.0.0.1:8000:80"
    environment:
      APP_ENV: dev
      # Compte MySQL dédié de l'API (droits minimaux)
      DATABASE_URL: "mysql://api_voyages:api_dev_password@db:3306/agence_voyage?serverVersion=10.4.32-MariaDB&charset=utf8mb4"
      # Compte qui a le droit de modifier la structure, utilisé uniquement pour les migrations
      DATABASE_MIGRATIONS_URL: "mysql://api_migrations:migrations_dev_password@db:3306/agence_voyage?serverVersion=10.4.32-MariaDB&charset=utf8mb4"
    depends_on:
      db:
        condition: service_healthy

  phpmyadmin:
    image: phpmyadmin:5
    profiles: ["outils"]   # lancé seulement avec : docker compose --profile outils up -d
    environment:
      PMA_HOST: db
    ports:
      - "127.0.0.1:8081:80"
    depends_on:
      - db

volumes:
  db_data:
